# Our own Frappe apps, mounted into the official ERPNext containers (added on top of pwd.yml).
#
# The app's folder on this machine is mounted at apps/<name> and put on PYTHONPATH, so the
# containers run the code straight from the folder: no custom image to build, and an edit
# is live after a restart. `ls apps > sites/apps.txt` in the configurator lists it for bench.
#
# Default location: the app repository cloned next to this one
#   CareerPath/erpnext-playwright-ai-test-automation   (this repository)
#   CareerPath/retail_pos_india      (Retail POS India)
# Elsewhere? Set RETAIL_POS_INDIA_PATH in .env to its full path.

x-apps: &apps
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    - ${RETAIL_POS_INDIA_PATH:-../../retail_pos_india}:/home/frappe/frappe-bench/apps/retail_pos_india:ro
  environment: &apps-env
    PYTHONPATH: /home/frappe/frappe-bench/apps/retail_pos_india

services:
  configurator:
    <<: *apps
    environment:
      <<: *apps-env
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
  create-site:
    <<: *apps
  backend:
    <<: *apps
    environment:
      <<: *apps-env
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
  queue-long:
    <<: *apps
    environment:
      <<: *apps-env
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
  queue-short:
    <<: *apps
    environment:
      <<: *apps-env
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
  scheduler:
    <<: *apps
  # The web server (nginx) serves /assets/<app>/... from /home/frappe/frappe-bench/assets, a folder
  # inside its own container (sites/assets links there, it is not shared). Mount the app's public
  # folder straight there, so app_include_js files are served; no `bench build` needed.
  frontend:
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ${RETAIL_POS_INDIA_PATH:-../../retail_pos_india}/retail_pos_india/public:/home/frappe/frappe-bench/assets/retail_pos_india:ro
