# The @smoke tests on every pull request and every push to main.
#
# Builds the same stack as a laptop (README "Set up"): ERPNext in Docker (docker/pwd.yml) with
# retail_pos_india mounted (docker/apps.yml), installs the app, then runs the tests; the seed
# (Playwright globalSetup) prepares the data on the brand-new site. Credentials are the local
# Docker values from .env.example: the site lives only inside this job.
name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The app is checked out inside the workspace here, not next to this repository.
      RETAIL_POS_INDIA_PATH: ${{ github.workspace }}/retail_pos_india
    steps:
      - uses: actions/checkout@v4

      - name: Check out retail_pos_india (main)
        uses: actions/checkout@v4
        with:
          repository: sudhansushekhar/retail_pos_india
          path: retail_pos_india

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: cp .env.example .env

      - name: Start ERPNext
        run: npm run erp:up

      - name: Wait until the site answers (site creation takes a few minutes)
        run: |
          # create-site runs once and exits 0 when the site and ERPNext are installed.
          code=$(timeout 900 docker wait erpnext-qa-create-site-1)
          if [ "$code" != "0" ]; then echo "site creation failed (exit $code)"; exit 1; fi
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/method/ping | grep -q pong; then echo "ready after ${i}0 s"; exit 0; fi
            sleep 10
          done
          echo "the site did not answer within 15 minutes"; exit 1

      - name: Install retail_pos_india on the site
        run: npm run erp:apps

      - run: npx playwright install --with-deps chromium

      - name: Smoke tests (Chromium)
        run: npx playwright test --grep @smoke --project=chromium

      - name: Site readiness (after the seed)
        if: always()
        run: npm run check

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            .results/reporting-labs
            .results/html
            .results/test-results
          retention-days: 14

      - name: ERPNext logs (on failure)
        if: failure()
        run: docker compose -p erpnext-qa -f docker/pwd.yml -f docker/apps.yml logs --tail=200 create-site backend
