# CI: on every pull request, every push to main, every night, or by hand (Actions → ERPNext POS · Playwright E2E → Run workflow).
#
#   lint     the CLAUDE.md rules a machine can check (seconds; no ERPNext needed)
#   e2e      ERPNext with retail_pos_india in Docker (from the app's own repository, as on a laptop),
#            the seed, a readiness check, then the tests:
#              pull request / push                     @smoke on Chromium
#              every night                             every test on Chromium and WebKit
#              by hand                                 choose the suite (smoke / full) and the browser
#   publish  a full run on main publishes its report to GitHub Pages: the dashboard
#            https://sudhansushekhar.github.io/erpnext-playwright-ai-test-automation/
#
# Credentials are the local Docker values of .env.example: the site exists only inside the job.
name: ERPNext POS · Playwright E2E
# Each run's title says what it ran.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Nightly · every test · Chromium + WebKit'
  || github.event_name == 'workflow_dispatch' && format('By hand · {0} · {1}', inputs.suite, inputs.browser)
  || github.event_name == 'pull_request' && format('PR · {0}', github.event.pull_request.title)
  || format('main · {0}', github.event.head_commit.message) }}

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke: @smoke on Chromium. full: every test on both browsers (published to the dashboard from main)'
        type: choice
        options: [smoke, full]
        default: smoke
      browser:
        description: 'Which browser(s)'
        type: choice
        options: [chromium, webkit, both]
        default: chromium

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (CLAUDE.md rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    name: E2E tests (ERPNext in Docker)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUITE: ${{ (github.event_name == 'schedule' || inputs.suite == 'full') && 'full' || 'smoke' }}
      # Nightly: both browsers. By hand: the one chosen. Pull requests and pushes: Chromium.
      BROWSER: ${{ github.event_name == 'schedule' && 'both' || inputs.browser || 'chromium' }}
      # Parallel test workers, one lane each (cashier, counter, stock item; docs/test-data.md "Lanes").
      # The runner has 4 CPUs and also runs ERPNext, so 2 browsers at a time.
      WORKERS: 2
    steps:
      - uses: actions/checkout@v5

      - name: Check out retail_pos_india (main), which runs ERPNext
        uses: actions/checkout@v5
        with:
          repository: sudhansushekhar/retail_pos_india
          path: retail_pos_india

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: cp .env.example .env

      - name: Start ERPNext
        working-directory: retail_pos_india
        run: npm run erp:up

      - name: Wait for the site (created on first start, a few minutes)
        run: |
          # create-site runs once and exits 0 when the site and ERPNext are installed.
          code=$(timeout 900 docker wait erpnext-qa-create-site-1)
          if [ "$code" != "0" ]; then echo "site creation failed (exit $code)"; exit 1; fi
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/method/ping | grep -q pong; then echo "ready"; exit 0; fi
            sleep 10
          done
          echo "the site does not answer"; exit 1

      - name: Install retail_pos_india on the site
        working-directory: retail_pos_india
        run: npm run erp:app

      - name: Seed the test data, then check the site is ready
        run: |
          npm run seed
          npm run check

      - name: Install the browsers (${{ env.BROWSER }})
        run: |
          if [ "$BROWSER" = "both" ]; then npx playwright install --with-deps chromium webkit
          else npx playwright install --with-deps "$BROWSER"; fi

      # The report's run history (trend, new vs known failures, flaky, slower) lives in one file;
      # the cache carries it from run to run, separately for smoke and full runs and per branch.
      - name: Restore the report history
        uses: actions/cache@v4
        with:
          path: .results/reporting-labs.history.json
          key: report-history-${{ env.SUITE }}-${{ env.BROWSER }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: report-history-${{ env.SUITE }}-${{ env.BROWSER }}-${{ github.ref_name }}-

      - name: Tests (${{ env.SUITE }}, ${{ env.BROWSER }})
        run: |
          args=()
          if [ "$SUITE" = "smoke" ]; then args+=(--grep @smoke); fi
          if [ "$BROWSER" != "both" ]; then args+=(--project="$BROWSER"); fi
          npx playwright test "${args[@]}"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            .results/reporting-labs
            .results/html
            .results/test-results
          retention-days: 14

      # The dashboard is public: only the reporting-labs report goes there (passwords and payment
      # details masked by reporting-labs.config.js), without traces or videos, which record what was typed.
      - name: Prepare the dashboard
        if: always() && env.SUITE == 'full' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r .results/reporting-labs/. _site/
          find _site \( -name '*.zip' -o -name '*.webm' \) -delete
          touch _site/.nojekyll

      - name: Upload the dashboard
        if: always() && env.SUITE == 'full' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: ERPNext logs (on failure)
        if: failure()
        working-directory: retail_pos_india
        run: docker compose -p erpnext-qa -f docker/pwd.yml -f docker/apps.yml logs --tail=200 create-site backend

  publish:
    name: Publish the dashboard
    needs: e2e
    # A full run on main, passed or failed (the dashboard shows failures too); not if it was cancelled.
    if: >-
      always() && needs.e2e.result != 'cancelled' && needs.e2e.result != 'skipped' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
